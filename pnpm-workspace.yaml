packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true
  vue-demi: true

packageExtensions:
  "@vee-validate/zod":
    peerDependencies:
      zod: "^3.24.0 || ^4.0.0"

peerDependencyRules:
  allowedVersions:
    "@vee-validate/zod>zod": ">=4"

catalog:
  typescript: "7.0.2"
  vue: "3.5.45"
  vite: "8.3.8"
  vue-router: "5.5.1"
  pinia: "4.1.0"
  vitest: "5.1.0"
  vue-tsc: "3.3.14"
  tailwindcss: "4.3.5"
  oxlint: "1.93.0"
  oxfmt: "0.78.0"
  oxlint-tsgolint: "7.0.2007"
  hono: "4.13.18"
  drizzle-orm: "0.45.4"
  "@supabase/supabase-js": "2.119.0"
  zod: "4.6.7"
  "@hono/zod-validator": "0.9.1"
  pino: "10.4.0"
  resend: "6.38.1"
  "@sentry/node": "11.12.0"
  tsx: "4.23.15"
  turbo: "2.11.11"
  lefthook: "2.2.2"

minimumReleaseAgeExclude:
  - "@lucide/vue@1.73.0"
