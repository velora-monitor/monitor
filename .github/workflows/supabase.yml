name: Supabase

on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.2.0

      - name: Start the local database
        run: supabase db start

      - name: Apply migrations
        run: supabase db reset --no-seed

      - name: Lint database functions
        run: supabase db lint --fail-on error

      - name: Check security advisors
        run: supabase db advisors --type security --fail-on error

      - name: Test row level security
        run: supabase test db
