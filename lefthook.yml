commit-msg:
  commands:
    conventional:
      run: |
        message=$(head -n 1 "{1}")
        if ! printf '%s\n' "$message" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].+'; then
          echo "Commit subject must use Conventional Commits: type(scope): summary"
          exit 1
        fi

pre-commit:
  parallel: false
  commands:
    oxfmt:
      glob: "**/*.{ts,vue}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    oxlint:
      glob: "**/*.{ts,vue}"
      run: pnpm exec oxlint --deny-warnings {staged_files}
